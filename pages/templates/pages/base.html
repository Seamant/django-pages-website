<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Website{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f7f7f7; }
        header { background: #0057b7; color: #fff; padding: 20px; }
        nav a { color: #fff; margin-right: 15px; text-decoration: none; }
        .container { max-width: 900px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        footer { text-align: center; padding: 12px 0; color: #666; font-size: 0.95rem; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>My Django Website</h1>
            <nav>
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'about' %}">About</a>
                <a href="{% url 'contact' %}">Contact</a>
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <div class="container">
            &copy; {% now "Y" %} My Django Website
        </div>
    </footer>
</body>
</html>
